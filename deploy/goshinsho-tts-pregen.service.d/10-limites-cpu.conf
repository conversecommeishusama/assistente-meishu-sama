# 2026-10-22 — tecto rígido de CPU para a pré-geração de áudio.
#
# Motivo: o `Nice=10`/`CPUWeight=20` da unidade dão PRIORIDADE ao gunicorn, mas
# não limitam o consumo total. Com 14 núcleos, o XTTS podia ocupar 4-5 e, quando
# o torch abria threads intra-op, ia além disso — o /api/chat (30-170 s por
# natureza) passava a competir e podia estourar o timeout de 300 s.
#
# Agora há um limite de cgroup: no máximo 6 núcleos (600%), quaisquer que sejam
# as threads que o processo abra. Sobram sempre 8 núcleos para os 4 workers do
# `goshinsho.service` e os 2 do `goshinsho-portal.service` — o pedido de 22/10
# de deixar o app com folga real, não apenas com prioridade.
#
# Memória: o lote chegou a 9,7 GB de pico com 5 daemons (2026-10-21). Com 2
# daemons fica em ~4 GB; 8 GB de tecto protege o serviço web de um OOM.
#
# Para suspender o limite: apagar este ficheiro e `systemctl daemon-reload`.

[Service]
CPUQuota=600%
CPUQuotaPeriodSec=100ms
MemoryHigh=6G
MemoryMax=8G
# Reforça a prioridade: em disputa, o app fica com ~5x mais CPU que o lote.
CPUWeight=20
IOWeight=20
